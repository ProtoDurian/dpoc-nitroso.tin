# landscape pichu (dev, SIN) — dependency module choices
modules:
  database:
    main: {type: neon, version: 17}
migrations:
  - name: tin-neon-to-ps
    module: main
    to:
      type: planetscale
      targetName: dpoc-r2-db-pichu-tin-mwe6484z
      drainConfirmMs: 10000
    fenceMaxSeconds: 30
    holdSeconds: 10
  - name: tin-ps-to-neon
    module: main
    to:
      type: neon
      targetName: dpoc-r2-db-pichu-neon-mwe6484z
      drainConfirmMs: 10000
    fenceMaxSeconds: 30
    holdSeconds: 10
