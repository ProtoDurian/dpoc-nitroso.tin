{{- define "tin.deployment" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.dpoc.platform }}
  annotations:
    reloader.stakater.com/search: "true"
  labels:
    app: {{ .Chart.Name }}
    dpoc.specpenguin.dev/platform: {{ .Values.dpoc.platform }}
    dpoc.specpenguin.dev/service: {{ .Values.dpoc.service }}
    dpoc.specpenguin.dev/landscape: {{ .Values.dpoc.landscape }}
    dpoc.specpenguin.dev/cluster: {{ .Values.dpoc.cluster }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1} # spike F6 recipe
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      annotations:
        atomi.cloud/db-reload: live
        atomi.cloud/db-ctl-port: "8081"
      labels:
        app: {{ .Chart.Name }}
        dpoc.specpenguin.dev/platform: {{ .Values.dpoc.platform }}
        dpoc.specpenguin.dev/service: {{ .Values.dpoc.service }}
        dpoc.specpenguin.dev/landscape: {{ .Values.dpoc.landscape }}
    spec:
      terminationGracePeriodSeconds: 120 # keep queued HTTP calls and /dbctl alive through a hold
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - {name: http, containerPort: 3000}
            - {name: dbctl, containerPort: 8081}
          env:
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: DPOC_CLUSTER
              value: {{ .Values.dpoc.cluster | quote }}
            - name: DPOC_LANDSCAPE
              value: {{ .Values.dpoc.landscape | quote }}
            - name: DPOC_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: DPOC_ISSUER
              value: {{ printf "https://lithium.aldehyde.%s.%s/oidc" .Values.dpoc.landscape (index .Values.dpoc.roots 0) | quote }}
            - name: NODE_EXTRA_CA_CERTS   # the dpoc private CA (T3 writes ConfigMap dpoc-ca); needed to fetch the issuer JWKS
              value: /ca/ca.crt
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
          volumeMounts:
            - name: podinfo
              mountPath: /etc/podinfo
              readOnly: true
            - name: dpoc-ca
              mountPath: /ca
              readOnly: true
            # G3: the pod does NOT start until T3 has written the database secret
            # (stays ContainerCreating; the app then finds the file at first poll).
            - name: database-main
              mountPath: /deps/database-main
              readOnly: true
            - name: kv-cache
              mountPath: /deps/kv-cache
              readOnly: true
            - name: store-files
              mountPath: /deps/store-files
              readOnly: true
            - name: email-mail
              mountPath: /deps/email-mail
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: podinfo
          downwardAPI:
            items: [{path: annotations, fieldRef: {fieldPath: metadata.annotations}}]
        - name: dpoc-ca
          configMap: {name: dpoc-ca, optional: true}
        - name: database-main
          secret: {secretName: {{ printf "%s-database-main" .Values.dpoc.service }}} # NOT optional (G3)
        - name: kv-cache
          secret:
            secretName: {{ printf "%s-kv-cache" .Values.dpoc.service }}
            optional: true
        - name: store-files
          secret:
            secretName: {{ printf "%s-store-files" .Values.dpoc.service }}
            optional: true
        - name: email-mail
          secret:
            secretName: {{ printf "%s-email-mail" .Values.dpoc.service }}
            optional: true
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end -}}
{{- $deployment := include "tin.deployment" . | fromYaml -}}
{{- include "tin.checkLiveSecrets" (dict "root" . "object" $deployment) -}}
{{ toYaml $deployment }}
