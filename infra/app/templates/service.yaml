apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.dpoc.platform }}
  labels:
    app: {{ .Chart.Name }}
    dpoc.specpenguin.dev/platform: {{ .Values.dpoc.platform }}
    dpoc.specpenguin.dev/service: {{ .Values.dpoc.service }}
spec:
  selector:
    app: {{ .Chart.Name }}
  ports:
    - {name: http, port: 80, targetPort: http}
